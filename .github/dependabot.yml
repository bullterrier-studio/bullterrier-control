# Weekly update pull requests for the pinned actions (their commit SHAs) and the locked Python and Rust dependencies,
# with Conventional Commit messages (`ci: bump ...`, `build(deps): bump ...`). Minor and patch updates come grouped, one
# pull request per ecosystem; a major update gets its own. CI runs on each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a fresh release be noticed (and yanked) before it is proposed
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]
