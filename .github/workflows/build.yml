# Build the sdist and wheel once, check them as PyPI would, keep them as the `dist` artifact (release.yml publishes
# exactly these files), and prove the wheel works when installed on its own, away from the checkout. Called by ci.yml
# once every check passed; can also be started by hand (only release.yml publishes, and only what its own CI built).
name: Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false # these files may be published: nothing restored from a cache goes into them
      - name: Build the sdist and wheel and check them (twine, check-wheel-contents)
        run: uv run --locked poe build-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/check/
          if-no-files-found: error

  smoke:
    name: Install the wheel on ${{ matrix.os }}
    needs: dist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          python-version: "3.12"
      # no checkout: the environment has the wheel and its dependencies only
      - name: Install the wheel in a fresh environment and run the command
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls "$GITHUB_WORKSPACE"/dist/*.whl)
          cd "$RUNNER_TEMP"
          uv venv --quiet smoke
          uv pip install --quiet --python smoke "$wheel"
          if [ "$RUNNER_OS" = Windows ]; then bin=smoke/Scripts; else bin=smoke/bin; fi
          "$bin/bt-control" --version
          "$bin/bt-control" --help
          "$bin/python" -c "import bullterrier_control; print(bullterrier_control.__version__)"
