# Build the distributions once, check them as PyPI would, keep them as the `dist` artifact (release.yml publishes
# exactly these files), and prove each works when installed on its own, away from the checkout. Called by ci.yml once
# every check passed; can also be started by hand (only release.yml publishes, and only what its own CI built).
#
# The sdist and one abi3 wheel per platform; which platforms, and why: docs/design-decisions.md, "Platforms". No job
# here restores a build cache: what it builds may be published.
name: Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    name: Build the sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false # these files may be published: nothing restored from a cache goes into them
      # maturin reads the crates' metadata with cargo, so the sdist is made with the toolchain rust-toolchain.toml pins
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && cargo --version
      - name: Build the sdist
        run: uv build --sdist --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Build the wheel for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # one red platform must not hide the state of the others
      matrix:
        include:
          # Linux: in the manylinux container of the runner's own architecture (maturin-action's), so nothing is
          # cross-compiled; macOS x86_64 is cross-compiled on the arm64 runner
          - { platform: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { platform: macos-arm64, runner: macos-latest, target: aarch64 }
          - { platform: macos-x86_64, runner: macos-latest, target: x86_64 }
          - { platform: windows-x86_64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the interpreter maturin builds the abi3 wheel for (the manylinux container has its own)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      # maturin's version from [build-system] in pyproject.toml, the Rust toolchain from rust-toolchain.toml
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
          sccache: false # these files may be published: nothing restored from a cache goes into them
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  dist:
    name: Check the distributions and keep them
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # the checkout is the package tree check-wheel-contents compares each wheel with; nothing is built here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Install the checking tools (twine, check-wheel-contents), not the package
        run: uv sync --locked --no-install-project
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      # the checks `poe build-check` runs locally: twine, one build of the extension per wheel, check-wheel-contents
      - name: Check every distribution (tools/check_dists.py)
        run: uv run --no-sync python tools/check_dists.py dist && ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Install the ${{ matrix.from }} on ${{ matrix.os }}
    needs: dist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, from: wheel } # Linux x86_64
          - { os: ubuntu-24.04-arm, from: wheel } # Linux aarch64
          - { os: macos-latest, from: wheel } # macOS arm64
          - { os: macos-15-intel, from: wheel } # macOS x86_64
          - { os: windows-latest, from: wheel } # Windows x86_64
          - { os: ubuntu-latest, from: sdist } # built here with Rust, as on a platform without a wheel
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          python-version: "3.12"
      # only the script that names the installed file, and the patch the extension runs, kept outside the environment
      # under test
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: checkout
          sparse-checkout: |
            tools/check_installed.py
            examples/gallery/slew.toml
          sparse-checkout-cone-mode: false
      # an sdist builds on the machine that installs it: that machine needs the toolchain the sdist pins
      - name: Install the Rust toolchain the sdist pins (its rust-toolchain.toml)
        if: matrix.from == 'sdist'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf dist/bullterrier_control-*.tar.gz -C "$RUNNER_TEMP/unpacked" --strip-components=1
          cd "$RUNNER_TEMP/unpacked"
          rustup toolchain install --no-self-update && cargo --version
      # The environment has the package and its dependencies only. A wheel comes from the artifact alone (`--no-index`:
      # no release from PyPI; `--only-binary`: no sdist built on the fly), the platform's wheel chosen by uv, then its
      # dependencies from the index. The sdist is installed from its file and built here, with the toolchain its own
      # rust-toolchain.toml pins (installed in the step before). check_installed.py then names the artifact's file it came
      # from, or fails. `slew` is a shaper written in the Rust extension: sampling the gallery patch that uses it runs the
      # installed build, and the patch is read from the sparse checkout beside it, not from the environment.
      - name: Install the ${{ matrix.from }} in a fresh environment and sample a patch that runs the extension
        shell: bash
        env:
          FROM: ${{ matrix.from }}
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/dist"
          patch="$GITHUB_WORKSPACE/checkout/examples/gallery/slew.toml"
          cd "$RUNNER_TEMP"
          uv venv --quiet smoke
          if [ "$RUNNER_OS" = Windows ]; then bin=smoke/Scripts; else bin=smoke/bin; fi
          if [ "$FROM" = wheel ]; then
            uv pip install --python smoke --no-index --find-links "$dist" --only-binary bullterrier-control --no-deps \
              bullterrier-control
            "$bin/python" -c "from importlib.metadata import requires; print('\n'.join(requires('bullterrier-control')))" \
              > requirements.txt
            uv pip install --python smoke --requirement requirements.txt
          else
            uv pip install --python smoke "$dist"/bullterrier_control-*.tar.gz
          fi
          "$bin/python" "$GITHUB_WORKSPACE/checkout/tools/check_installed.py" "$dist" --from "$FROM"
          uv pip list --python smoke
          "$bin/bt-control" --version
          "$bin/bt-control" --help
          "$bin/bt-control" sample "$patch" input slew --to 6 --rate 20 --csv > sampled.csv
          "$bin/python" - <<'PY'
          import csv

          with open("sampled.csv", encoding="utf-8", newline="") as file:
              rows = [(float(row["input"]), float(row["slew"])) for row in csv.DictReader(file)]
          assert len(rows) == 121, len(rows)
          # the input is a staircase with jumps; the extension's slew follows it without jumping
          assert max(abs(a - b) for a, b in rows) > 0.1, "slew left the staircase unchanged: the extension did not run"
          assert all(0.0 <= slew <= 1.0 for _, slew in rows)
          print("slew ran in the installed extension:", len(rows), "samples")
          PY
