# Known vulnerabilities in the locked dependencies (pip-audit), code scanning (CodeQL), and the dependencies a pull
# request adds (dependency review). Part of every CI run (ci.yml calls it, so a known vulnerability stops the build and
# the release), and on its own weekly, because advisories appear without any change here, and by hand.
# No `concurrency`: called from ci.yml, a group shared with a scheduled run could cancel CI's pending security job.
name: Security

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: Audit the locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv run --locked poe audit

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the findings to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  dependency-review:
    name: Dependency review
    # called from ci.yml the event is ci.yml's: a pull request runs this, a push, tag, merge queue or schedule skips
    # it (a skipped job does not fail the workflow), since only a pull request has a base to compare against
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
