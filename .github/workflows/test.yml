# The test suite (it runs the import contracts too) on every supported operating system and Python. A pull request runs
# the corners of that grid: the oldest and newest Python on Linux, and one newer Python on macOS and on Windows; every
# other event (main, tags, releases, by hand) runs all nine. Called by ci.yml; can also be started by hand.
name: Test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # one red platform must not hide the state of the others
      # `github.event_name` is the caller's event (ci.yml's) when this file is called
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.14"},{"os":"macos-latest","python":"3.13"},{"os":"windows-latest","python":"3.13"}]}' || '{"os":["ubuntu-latest","macos-latest","windows-latest"],"python":["3.12","3.13","3.14"]}') }}
    steps:
      # Windows runners check text files out with CRLF line endings; the suite expects the files as committed
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install the locked dependencies
        run: uv sync --locked
      # -ra lists every skipped or expected-failing test with its reason; --durations shows what makes the run slow
      - name: Tests (pytest; skips and the 10 slowest tests are listed)
        run: uv run --locked poe test -ra --durations=10
