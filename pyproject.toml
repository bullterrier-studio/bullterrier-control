[project]
name = "bullterrier-control"
version = "0.0.0"
description = "Control signals: keyframes, LFOs, envelopes and shaping, read at any moment in seconds."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jcakstins", email = "janis.cakstins@gmail.com" }
]
# 3.12 is the oldest version the code needs (PEP 695 generics are its newest syntax); the suite is green on 3.12, 3.13
# and 3.14.
requires-python = ">=3.12"
keywords = ["automation", "keyframes", "envelope", "LFO", "modulation", "easing", "control signal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# Each is declared with the first code that imports it (deptry fails on one nothing imports). numpy 1.26.4 is the first
# series with Python 3.12 wheels; no upper bounds: nothing is known to break on a newer release. These two stay the only
# runtime dependencies (docs/design-decisions.md).
dependencies = [
    "numpy>=1.26.4",
    "pydantic>=2.7.1",
]

[project.urls]
Repository = "https://github.com/bullterrier-studio/bullterrier-control"
Issues = "https://github.com/bullterrier-studio/bullterrier-control/issues"

[project.scripts]
bt-control = "bullterrier_control.cli:main"

# Packages of sources and shapers: the registry imports every module of this group on its first query
# (bullterrier_control.registry). Our own come in the way a third party's do.
[project.entry-points."bullterrier_control.sources"]
bullterrier_control = "bullterrier_control.builtin"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

# Read by `check-wheel-contents` in `poe build-check`: the wheel holds exactly src/bullterrier_control minus these, so a
# shipped picture or test fails (W102), and so does library code left out of the wheel (W101).
[tool.check-wheel-contents]
package = "src/bullterrier_control"
package_omit = ["__pycache__", "*.pyc", ".*", "*.jpg", "*.jpeg", "*.png", "*.gif", "test_*.py"]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "check-wheel-contents>=0.6.3",
    "deptry>=0.25.1",
    "git-cliff>=2.14.2",
    "hypothesis>=6.170.8",
    "import-linter>=2.15",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "packaging>=26.3",
    "pip-audit>=2.10.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "twine>=7.0.0",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
    "vulture>=2.16",
    "zizmor>=1.31.1",
]

# One command for agents and humans: `uv run poe check` before every push, `uv run poe fix` when it complains.
[tool.poe.tasks]
# PYTHONWARNDEFAULTENCODING makes the interpreter, and every xdist worker it starts, report text IO without an
# encoding (EncodingWarning), which `filterwarnings` below turns into a failure; an -X flag would not reach the workers
test = { cmd = "pytest -q -n auto", env = { PYTHONWARNDEFAULTENCODING = "1" }, help = "Run the test suite on every CPU core (pytest-xdist; the order stays random)" }
# Not part of `check`: the suite on the oldest Python and the lowest release each direct dependency's floor allows, in a
# throwaway environment (uv.lock and the project environment stay as they are; the first run downloads the old
# releases). It is for CI. tests/tools/test_lint_and_type_gate.py is left out because mypy's verdict on our source
# depends on numpy's own type annotations, which are not what this checks. No PYTHONWARNDEFAULTENCODING here: numpy 1.26
# runs a text-mode subprocess when numpy.testing is imported, and the encoding of our own IO is `poe test`'s concern.
# tests/test_schema_drift.py is left out too: the committed schema is the text the locked pydantic writes, and an older
# pydantic words some of it differently (tests/test_cli.py checks what the schema means on every version).
check-min-deps = { cmd = "uv run --isolated --python 3.12 --resolution lowest-direct pytest -q -n auto --ignore=tests/tools/test_lint_and_type_gate.py --ignore=tests/test_schema_drift.py", help = "Run the suite on Python 3.12 against the lowest allowed release of every dependency" }
# Not part of `check`: it asks the PyPI vulnerability database about every locked package (runtime, extras and dev
# tools, pinned by hash), so it needs the network and its verdict changes as advisories are published. For CI and
# before a release; an advisory with no fixed release is ignored with `--ignore-vuln ID` and listed in SECURITY.md.
audit = { sequence = ["uv export --frozen --all-extras --all-groups --no-emit-project --quiet --output-file dist/audit/requirements.txt", "pip-audit --requirement dist/audit/requirements.txt --disable-pip --require-hashes --progress-spinner off"], default_item_type = "cmd", help = "Check every locked dependency against known vulnerabilities (needs the network)" }
fix = { sequence = ["ruff check --fix .", "ruff format ."], default_item_type = "cmd", help = "Apply every automatic lint and format fix" }
# The sdist and wheel as PyPI would get them, built into dist/check (git-ignored, emptied first) and checked by twine
# (metadata, rendered README; the quoted glob is twine's to expand) and check-wheel-contents (stray or unimportable files)
build-check = { sequence = ["uv build --quiet --clear --no-create-gitignore --out-dir dist/check", "twine check --strict 'dist/check/*'", "check-wheel-contents dist/check"], default_item_type = "cmd", help = "Build the sdist and wheel and check what would be uploaded" }
# The GitHub workflows and dependabot.yml: actionlint (syntax, expressions, job wiring; it also runs shellcheck on the
# `run:` scripts when shellcheck is installed, as on GitHub's runners) and zizmor (unpinned actions, template
# injection, persisted credentials, over-broad permissions). `uv run`, because the actionlint-py distribution names
# its program differently. zizmor stays offline so the gate needs no network; its online audits need a GitHub token.
lint-workflows = { sequence = ["uv run actionlint", "zizmor --offline .github"], default_item_type = "cmd", help = "Lint the GitHub workflows (actionlint, zizmor)" }
check = { sequence = ["ruff format --check .", "ruff check .", { ref = "lint-workflows" }, "vulture", "deptry .", { ref = "build-check" }, "mypy", { ref = "test" }], default_item_type = "cmd", help = "The full gate (format, lint, workflows, dead code, dependencies, distributions, types, tests); stops at the first failure" }
# Developer commands that need a source checkout (tools/dev.py); extra arguments go to the script
new-source = { cmd = "uv run python tools/dev.py new-source", help = "Write a new source or shaper and its test from the templates (NAME --kind source|shaper)" }
# Release from main in one command: checks, plan, [y/N], version bump, changelog section, commit, annotated tag and an
# atomic push of main and the tag (CONTRIBUTING.md, "Releasing")
release = { cmd = "uv run python tools/release.py", help = "Release VERSION from main (e.g. 0.1.0rc1 to TestPyPI, 0.1.0 to PyPI): check, plan, ask, bump, tag, push [--dry-run] [--yes]" }
# `default_install_hook_types` in .pre-commit-config.yaml names the three hook types, so a bare `install` covers them
setup = { sequence = ["pre-commit install --install-hooks", "git config --local commit.template .gitmessage"], default_item_type = "cmd", help = "Install the git hooks and the commit-message template (once per clone)" }

# Read by tools/check_commit_message.py (the commit-msg hook): Conventional Commits 1.0 with these limits.
[tool.commit-message]
types = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
header-max-length = 72
body-max-line-length = 100
scope-pattern = "^[a-z0-9][a-z0-9/_-]*$"

[tool.pytest.ini_options]
testpaths = ["tests"]
# test files are named after the module they test, so equal names in different folders must never collide
# a misspelt marker or option is an error, not a silently ignored typo
# with xdist (`-n`), tests marked `xdist_group` stay on one worker, so an expensive module fixture is built once
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "--dist=loadgroup"]
# an xfail that starts passing fails the run, so the marker cannot outlive the bug it names
xfail_strict = true
# Every warning fails the test that raised it: a leaked file or process (ResourceWarning), a deprecated call, and, when
# PYTHONWARNDEFAULTENCODING=1 is set (`poe test` sets it), text IO that relies on the locale's encoding (EncodingWarning,
# PEP 597).
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Preview for the linter only (the formatter keeps its stable style), and only for the preview rules listed by code
# in `select` (PLC2701, PLW1514), never a whole preview family.
preview = true
explicit-preview-rules = true
# Opinionated enough to keep the code consistent, typed and documented; not so strict that it blocks progress.
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "SIM", "PIE", "RET", "PERF", "RUF", "PT", "DTZ", "T20",
    "PLE", "PLW",
    "ANN",  # type hints on public functions
    # docstrings on every PUBLIC module, class, method, function and package (a leading _ exempts a name); none empty
    "D100", "D101", "D102", "D103", "D104", "D106", "D419",
    # security (flake8-bandit): shell commands, pickle, yaml.load, eval/exec, hard-coded secrets, unchecked URL schemes,
    # insecure temp files and hashes, assert in library code. A subprocess call (S603) carries a `# noqa` saying why
    # its argv is safe.
    "S",
    "SLF001",  # private-member access: applies to tests too, which must not reach into the implementation
    "PLC2701",  # import of a private name (a preview rule, turned on alone by explicit-preview-rules)
    # a `# type: ignore` names its error code and a `# noqa` its rule (RUF100, in RUF, fails an unused `# noqa`)
    "PGH",
    "LOG",  # logging misuse (the root logger, a logger made by hand), should anything here ever log
    "PLW1514",  # text files opened without `encoding=` use the locale's, which breaks non-ASCII names on Windows (preview)
    "BLE",  # `except Exception` hides bugs; catch what can happen, or say why everything must be caught
    "PTH",  # pathlib, not os.path / open() / glob: one way to handle paths
]
# Deliberately NOT enabled: TRY003 / EM (message-style noise); the docstring style rules D2xx / D4xx beyond D419 (we
# enforce presence, not formatting); PLR2004 magic numbers and PLR0913 argument counts (numeric code and
# parameter-rich sources); FBT (boolean arguments); TID252 (relative imports are fine inside the package); PLC0415
# (lazy imports are deliberate).
# Ignored: ANN202 (private-function return types are mypy's job), ANN401 (Any is sometimes right), RUF001-003
# (unicode in strings, docstrings and comments is wanted), PLW2901 (rebinding a loop variable is a clear idiom).
ignore = ["ANN202", "ANN401", "RUF001", "RUF002", "RUF003", "PLW2901"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are exempt from annotations, docstrings, PLW, naming and assert-False; NOT from SLF001 / PLC2701, on purpose: a
# test must not reach into the implementation. Of bandit only these: assert is how pytest checks (S101), and a test
# runs our own interpreter and the developer's tools (python, git, uv) with argv it wrote itself (S603, S607).
"tests/**" = ["ANN", "D", "S101", "S603", "S607", "PLW", "N", "B011"]
"src/bullterrier_control/cli.py" = ["T20"]  # the CLI prints; add other presentation modules only with a reason
# scripts run by hand (the commit-message and config checks, the release): printing is their output
"tools/**" = ["T20"]
"**/__init__.py" = ["F401"]

# Pyright is the language server behind editor and Claude Code navigation (pyright-lsp); mypy stays the type gate. It only
# needs to find the project's virtualenv and the source layout so that every import resolves. Config lives here, not in a
# pyrightconfig.json (tests/tools/test_one_config_home.py forbids that file).
[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["**/__pycache__"]
extraPaths = ["src"]

# `uv run mypy` checks src and tests; the gate (`poe check`) and the pre-push hook run it.
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
# tests/ has no __init__.py (pytest imports it with importlib), so equal test file names in different folders need
# module names from their paths: tests/ops/test_x.py is tests.ops.test_x, src/bullterrier_control/x.py is bullterrier_control.x.
explicit_package_bases = true
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
# NOT enabled: warn_return_any, disallow_any_generics (bare np.ndarray everywhere), full --strict.

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Dead code fails the gate (`uv run vulture`, in `poe check` and the pre-push hook). Only src is scanned: code that only
# tests use is dead, unless a public `__all__` lists it. 60 % is vulture's lowest level: it reports unused functions,
# classes and attributes, not just unreachable lines. Each exemption below is a name or decorator that a framework calls.
[tool.vulture]
paths = ["src"]
min_confidence = 60
ignore_decorators = [
    "@model_validator",  # pydantic runs validators when a model is built
    "@field_validator",
    "@field_serializer",
    "@source",  # the registry finds a source or shaper through its decorator; patches call it by name
    "@shaper",
]
ignore_names = [
    "model_config",  # pydantic reads each model's settings from this class attribute
    "sample",  # `Signal.sample`: the public way to read a signal, called by users and other packages, not in the package yet
    "summary",  # `Registered.summary`: the first sentence of a source's docstring, for listings; not read in the package yet
    "__getattr__",  # module-level hooks (PEP 562) of `lib`: Python calls them for `lib.<name>` and `dir(lib)`
    "__dir__",
    "__doc__",  # `Registered.__doc__`: what `help()` shows
    "downbeats",  # `Grid`: the public conversions of a format, called by users and other packages' readers, not in the package yet
    "seconds_at",
    "beat_at",
    "parse",  # `FormatModel.parse`: the public way in for data from outside, called by users, tools and tests
    # format fields and vocabulary: data that consumers read (a Series' rate, an Event's t, strength, label and pitch,
    # a Bundle's format, source and grid, the Unit members), not all of it used inside the package
    "rate",
    "t",
    "strength",
    "label",
    "pitch",
    "format",
    "source",
    "grid",
    "DECIBELS",
    "HERTZ",
    "MIDI",
    "RATIO",
    "SECONDS",
    "BEATS",
]

# Every import is declared, and only once in the right place (`uv run deptry .`, in `poe check`): a missing, unused,
# transitive-only or development-only dependency fails. tests/ is not scanned (deptry's default): tests may use the
# development tools.
[tool.deptry]
# check_release: tools/release.py imports its sibling script (a script's own folder is first on sys.path)
known_first_party = ["bullterrier_control", "check_release"]

[tool.deptry.per_rule_ignores]
# packaging (PEP 440 versions) is used by tools/release.py, a developer command that runs in the dev environment
DEP004 = ["packaging"]

# The layering rules of CLAUDE.md, checked by `uv run lint-imports` (tests/test_layering.py runs it, and proves each
# contract fails on a forbidden import). Imports flow downward only.
[tool.importlinter]
root_package = "bullterrier_control"

[[tool.importlinter.contracts]]
name = "Layers: app > builtin | lib > plugin > registry > rendered | inputs > signal | params | easing > formats > validated > errors"
type = "layers"
containers = ["bullterrier_control"]
exhaustive = true  # a new top-level module must be placed in a layer here
layers = [
    "__main__",  # `python -m bullterrier_control`: runs the command line
    "cli",  # app: the command line
    "builtin | lib",  # bullterrier-control's own sources and shapers (found through the entry point) | every one by name
    "plugin",  # the author API: the names a package of sources and shapers uses
    "registry",  # the table of sources and shapers, and the queries over it
    "rendered | inputs",  # a signal that needs history, rendered once | the data a source takes besides parameters (keyframes)
    "signal | params | easing",  # what a signal is and how it is read | how a source or shaper declares its parameters | easing curves
    "formats",  # the plain-data formats
    "validated",  # the base of every validated model and its strict value types
    "errors",  # the exceptions: they import nothing, so every layer may raise them
]

[[tool.importlinter.contracts]]
name = "Built-in sources never import each other"
type = "independence"
# shared numeric code goes to a module named for its concept, below `builtin`, not from one source into another
modules = ["bullterrier_control.builtin.*"]

[[tool.importlinter.contracts]]
name = "Built-in sources use only the author API"
type = "forbidden"
source_modules = ["bullterrier_control.builtin"]
forbidden_modules = [
    "bullterrier_control.cli",
    "bullterrier_control.easing",
    "bullterrier_control.errors",
    "bullterrier_control.formats",
    "bullterrier_control.inputs",
    "bullterrier_control.lib",
    "bullterrier_control.params",
    "bullterrier_control.registry",
    "bullterrier_control.rendered",
    "bullterrier_control.signal",
    "bullterrier_control.validated",
]
# `bullterrier_control.plugin` is the one door: it re-exports what a source needs, so a source reaches the rest only
# through it (the import of plugin itself reaches them indirectly, which is the point)
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Formats: bundle > series | event | grid > model | units"
type = "layers"
containers = ["bullterrier_control.formats"]
exhaustive = true  # a new format module must be placed in a layer here
# each format builds on the shared base and the units, never on another format: the formats are independent siblings
layers = ["bundle", "series | event | grid", "model | units"]

# Read by git-cliff when `uv run poe release` writes a release's section of CHANGELOG.md: the Conventional Commits since
# the last tag, grouped as Keep a Changelog does. A commit only appears if a parser below names its group; the rest
# (docs, test, style, ci, build, chore, refactor: work a user of the library does not see) is left out, except a
# breaking change, which always appears. The `<!-- n -->` prefixes put the groups in Keep a Changelog's order and are
# stripped from the headings.
[tool.git-cliff.changelog]
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}{{ commit.scope }}: {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
tag_pattern = "^v[0-9]"
# a release lists every change since the previous release, not since its own pre-releases (v0.2.0rc1 ...)
ignore_tags = "^v[0-9]+\\.[0-9]+\\.[0-9]+(a|b|rc)[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^[a-z]+\\(security\\)", group = "<!-- 5 -->Security" },
    { message = "^(feat|fix|perf|refactor)(\\([^)]*\\))?!?: (remove|drop|delete) ", group = "<!-- 3 -->Removed" },
    { field = "breaking", pattern = "true", group = "<!-- 1 -->Changed" },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 4 -->Fixed" },
    { message = "^(perf|revert)", group = "<!-- 1 -->Changed" },
]
