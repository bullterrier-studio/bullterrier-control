[package]
name = "bullterrier-control-python"
description = "The Python bindings of bullterrier-control's Rust core: builds the extension `bullterrier_control._native._core`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]
# no Rust tests of its own: the Python suite tests the extension through the package's public interface
test = false
doctest = false

[dependencies]
bullterrier-control.workspace = true
numpy.workspace = true
pyo3.workspace = true
serde_json.workspace = true

[lints]
workspace = true
