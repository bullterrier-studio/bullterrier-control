[package]
name = "bullterrier-control"
description = "The numeric core of bullterrier-control: its shapers and the primitives they share, in pure Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "bullterrier_control"

[dependencies]
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

# the built-in files are compiled in by the build script's generated `mod` declarations, which cargo-shear cannot see
[package.metadata.cargo-shear]
ignored-paths = ["src/builtin/*.rs"]
