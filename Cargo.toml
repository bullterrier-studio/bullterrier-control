# The Rust core of bullterrier-control: `crates/core` (pure Rust: the shapers) and `crates/python` (the bindings that
# build `bullterrier_control._native._core`; maturin builds it, see [tool.maturin] in pyproject.toml). Rust settings
# live here, except what a tool cannot read from this file: rust-toolchain.toml, rustfmt.toml, deny.toml.
[workspace]
resolver = "3"
members = ["crates/core", "crates/macros", "crates/python"]

[workspace.package]
version = "0.0.0"  # never published on its own: the Python package's version (pyproject.toml) is the release's
edition = "2024"
rust-version = "1.99.1"  # the toolchain rust-toolchain.toml pins
license = "MIT"
repository = "https://github.com/bullterrier-studio/bullterrier-control"
publish = false

[workspace.dependencies]
bullterrier-control = { path = "crates/core" }
bullterrier-control-macros = { path = "crates/macros" }
# cap: the core's test binary allocates through it, so a runaway test aborts at a cap instead of filling the memory
cap = "0.1.2"
numpy = "0.30"
# proc-macro2, quote, syn: the derives of crates/macros read a struct or an enum and write its impls with them
proc-macro2 = "1"
proptest = "1.12"
quote = "1"
# abi3-py312: one wheel per platform serves every Python from 3.12 (the oldest the package supports)
pyo3 = { version = "0.30", features = ["abi3-py312"] }
# schemars: the bundle schema is generated from the structs that read the file
schemars = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a decimal read back is the f64 that was written, not one unit in the last place off (a file must
# render the same on every read)
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
syn = "3"
# toml: a patch file is TOML; only the parser (no serde, no writer), which keeps the file order through its spans
toml = { version = "1", default-features = false, features = ["parse"] }

# Warnings, not errors, so a newer compiler's new lint never breaks a user's install; the gate (`poe check`) runs clippy
# and rustdoc with `-D warnings`, so every one fails it.
[workspace.lints.rust]
missing_docs = "warn"  # ruff's D1xx: every public item is documented
unreachable_pub = "warn"  # `pub` only where a crate's users reach it; inside a crate, `pub(crate)`
unsafe_code = "deny"  # the core forbids it outright (`#![forbid(unsafe_code)]`); the bindings deny it too

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# restriction picks: no panicking shortcut (an error is returned), no printing (the library never prints)
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"

# The tools the gate runs that rustup does not install, each at the version the gate expects. `uv run poe setup`
# installs them; `tools/rust_tools.py` reads this table, the one place their versions are written.
[workspace.metadata.tools]
cargo-shear = "1.14.0"
cargo-deny = "0.20.2"
