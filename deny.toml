# cargo-deny (it cannot read Cargo.toml): which Rust crates the project may depend on. `poe check` runs the offline
# checks (bans, licenses, sources); `poe audit` adds the advisories, which need the network.

[graph]
all-features = true

[advisories]
ignore = []  # an advisory with no fixed release is ignored here by id, with a reason, and listed in SECURITY.md

[licenses]
# permissive licences that ask no more of the package than its own MIT does (notices kept, no copyleft)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true  # the workspace's own crates depend on each other by path
# Python reaches the core only through the bindings crate: the core stays pure Rust, with no PyO3 in it
deny = [
    { crate = "pyo3", wrappers = ["bullterrier-control-python", "numpy"] },
    { crate = "numpy", wrappers = ["bullterrier-control-python"] },
    { crate = "pyo3-ffi", wrappers = ["pyo3"] },
    { crate = "pyo3-build-config", wrappers = ["pyo3", "pyo3-ffi", "numpy"] },
    # not used yet: banned outright, so the first crate to use it (the bindings) names itself as a wrapper here
    { crate = "pythonize" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
